[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statresp"
version = "0.1.0"
description = "Stats for two-photon calcium imaging data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.13"
keywords = [
    "neuroscience",
    "calcium imaging",
    "two-photon",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy<2.3",
    "scipy>=1.13",
    "xarray>=2024.1",
    "torch>=2.0",
    "zetapy>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
examples = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["statresp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
